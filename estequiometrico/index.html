
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Estequiométrica</title>
</head>
<body>
    <h1>Calculadora Estequiométrica</h1>

    <h2>Calcular massa do produto</h2>

    <label>Equação balanceada:</label>
    <input id="equacao" value="2H2 + O2 -> 2H2O">
    <br><br>

    <label>Reagente conhecido:</label>
    <input id="reagente" value="H2">
    <br><br>

    <label>Massa do reagente (g):</label>
    <input id="massa" type="number" value="4" min="0" step="any">
    <br><br>

    <label>Produto desejado:</label>
    <input id="produto" value="H2O">
    <br><br>

    <button id="calcular">Calcular</button>

    <h2>Resultado</h2>
    <pre id="resultado">Preencha os dados e clique em Calcular.</pre>

    <script src="script.js"></script>
</body>
</html>
